<!-- index.html — VELA BAY 3D entry page. Importmap maps "three" to the vendored three.js r187 module; loads src/main.js. No network reference anywhere. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="VELA BAY 3D — a GTA-style 3D open-world crime game in the browser. Steal cars, outrun the VBPD, pay off a $15,000 debt across 5 story missions.">
<meta name="theme-color" content="#0a0f1e">
<title>VELA BAY 3D — Steal cars. Outrun the VBPD. Pay off the debt.</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0f1e; font-family: Arial, Helvetica, sans-serif; }
  #game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  /* Menu overlay: gradient clear at top, dark only at bottom; menu lower-left. */
  #menu {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end;
    background: linear-gradient(to bottom, rgba(5,8,16,0) 45%, rgba(5,8,16,.55) 75%, rgba(5,8,16,.85) 100%);
    color: #fff;
  }
  .menu-panel { margin: 0 0 48px 48px; max-width: 560px; }
  .menu-panel h1.logo {
    margin: 0; font-size: 84px; line-height: .9; letter-spacing: 4px; font-weight: 900;
    color: #ffd21f; text-shadow: 0 0 24px rgba(255,150,40,.55), 0 2px 0 #7a3c00;
  }
  .menu-panel h2 { margin: 0 0 12px; font-size: 34px; letter-spacing: 3px; color: #ffd21f; }
  .menu-panel h3 { margin: 16px 0 4px; font-size: 14px; letter-spacing: 2px; color: #9fb4cc; }
  .menu-panel p { margin: 4px 0; font-size: 14px; line-height: 1.5; color: #e8eef5; }
  .menu-panel .eyebrow { font-size: 12px; letter-spacing: 4px; color: #9fb4cc; margin-bottom: 6px; }
  .menu-panel .tagline { font-size: 17px; font-style: italic; color: #ffd9a0; margin: 8px 0 20px; }
  .menu-panel .briefing { font-size: 13px; color: #c8d4e2; }
  .menu-panel .garage-money { font-size: 16px; font-weight: bold; color: #7dff8a; }
  .menu-panel .mission-box { border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 8px 12px; margin: 8px 0; background: rgba(8,12,20,.55); }
  .menu-panel .garage-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 0; font-size: 14px; }
  .menu-btn {
    display: block; margin: 8px 0; padding: 12px 22px; min-width: 300px; text-align: left;
    font-size: 16px; font-weight: bold; letter-spacing: 1px; color: #fff; cursor: pointer;
    background: rgba(8,12,20,.72); border: 1px solid rgba(255,255,255,.35); border-radius: 6px;
  }
  .menu-btn:hover { background: #ffd21f; color: #10131a; border-color: #ffd21f; }
  .menu-btn:disabled { opacity: .45; cursor: default; }
  .menu-btn:disabled:hover { background: rgba(8,12,20,.72); color: #fff; border-color: rgba(255,255,255,.35); }
  .garage-row .menu-btn { min-width: 0; margin: 0; padding: 8px 14px; font-size: 13px; }
  /* HOW TO PLAY: scrollable content + fixed CLOSE footer (reachable at 720p). */
  .howto-panel { max-height: 86vh; display: flex; flex-direction: column; background: rgba(8,12,20,.82); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 18px 22px; margin-bottom: 7vh; }
  .howto-body { overflow-y: auto; }
  .howto-foot { flex: none; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.2); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<noscript><p style="color:#fff;font-family:Arial,sans-serif;padding:24px">VELA BAY 3D needs JavaScript enabled to run. Please enable JavaScript and reload.</p></noscript>
<div id="game"><canvas id="game-canvas"></canvas></div>
<div id="hud-root"></div>
<div id="menu"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
